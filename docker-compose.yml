services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-estacionamiento
    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
    external: true
    name: 2dd11f57fc335746b5bb48e2051396c981798491d52a16bf85da7ab6f811fc74
